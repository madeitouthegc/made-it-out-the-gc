<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Made it out the GC — RSVP Admin</title>
<style>
:root{--cream:#F7EFE3;--brown:#5A2E19;--line:rgba(90,46,25,.2);--white:#fffaf3}
*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--brown);font-family:Arial,Helvetica,sans-serif}
.wrap{max-width:1200px;margin:auto;padding:40px 5vw 70px}.top{display:flex;justify-content:space-between;align-items:center;gap:20px;border-bottom:1px solid var(--line);padding-bottom:25px;margin-bottom:30px}
.brand{font-family:Georgia,serif;font-weight:700;font-size:24px;letter-spacing:-.04em}.back{color:var(--brown);text-decoration:none;font-size:12px;text-transform:uppercase;letter-spacing:.12em}
h1{font-family:Georgia,serif;font-size:clamp(50px,8vw,90px);line-height:.85;letter-spacing:-.07em;margin:0 0 35px}
.note{font-size:12px;opacity:.65;margin:-20px 0 30px;max-width:650px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:35px}.stat{border:1px solid var(--brown);border-radius:18px;padding:22px;background:rgba(255,250,243,.45)}.stat small{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.14em;margin-bottom:10px;opacity:.65}.stat strong{font-family:Georgia,serif;font-size:38px}
.table-wrap{overflow:auto;border:1px solid var(--brown);border-radius:20px;background:rgba(255,250,243,.45)}table{width:100%;border-collapse:collapse;min-width:850px}th,td{text-align:left;padding:15px;border-bottom:1px solid var(--line);font-size:13px;vertical-align:top}th{font-size:10px;text-transform:uppercase;letter-spacing:.12em}tr:last-child td{border-bottom:0}.empty{text-align:center;padding:50px;font-family:Georgia,serif;font-size:20px}.actions{display:flex;gap:10px;margin-bottom:20px}.btn{border:1px solid var(--brown);background:var(--brown);color:var(--cream);border-radius:999px;padding:13px 20px;cursor:pointer;text-transform:uppercase;letter-spacing:.12em;font-size:10px}
@media(max-width:700px){.stats{grid-template-columns:1fr 1fr}.top{align-items:flex-start}.brand{font-size:19px}}@media(max-width:430px){.stats{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><div class="brand">Made it out the GC</div><a class="back" href="./">← Website</a></div>
  <h1>RSVPs.</h1>
  <p class="note">Quick admin view for Event 001. This version reads the RSVPs saved by the current website in this browser.</p>
  <div class="stats">
    <div class="stat"><small>Total RSVPs</small><strong id="total">0</strong></div>
    <div class="stat"><small>Padel</small><strong id="padelCount">0</strong></div>
    <div class="stat"><small>Pilates</small><strong id="pilatesCount">0</strong></div>
    <div class="stat"><small>Both</small><strong id="bothCount">0</strong></div>
  </div>
  <div class="actions"><button class="btn" onclick="refresh()">Refresh</button></div>
  <div class="table-wrap" id="table"></div>
</div>
<script>
function esc(v){return String(v).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function refresh(){
 const rows=JSON.parse(localStorage.getItem('gcInterest')||'[]');
 document.getElementById('total').textContent=rows.length;
 document.getElementById('padelCount').textContent=rows.filter(x=>x.activity==='Padel').length;
 document.getElementById('pilatesCount').textContent=rows.filter(x=>x.activity==='Pilates').length;
 document.getElementById('bothCount').textContent=rows.filter(x=>x.activity==='Both').length;
 if(!rows.length){document.getElementById('table').innerHTML='<div class="empty">No RSVPs yet.</div>';return}
 document.getElementById('table').innerHTML='<table><thead><tr><th>Name</th><th>Email</th><th>Instagram</th><th>Coming for</th><th>Bring GC?</th><th>Notes</th><th>Submitted</th></tr></thead><tbody>'+rows.slice().reverse().map(x=>'<tr><td><strong>'+esc((x.first||'')+' '+(x.last||''))+'</strong></td><td>'+esc(x.email||'')+'</td><td>'+esc(x.instagram||'—')+'</td><td>'+esc(x.activity||'')+'</td><td>'+esc(x.bringGC||'')+'</td><td>'+esc(x.notes||'—')+'</td><td>'+new Date(x.submittedAt).toLocaleString('en-GB')+'</td></tr>').join('')+'</tbody></table>';
}
refresh();
</script>
</body>
</html>
